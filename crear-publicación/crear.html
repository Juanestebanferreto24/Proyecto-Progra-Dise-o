                <a href="https://www.facebook.com/profile.php?id=61596358841632"

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section id="crear-publicacion" class="crear-section">

            <h1>Crear publicación</h1>

            <p class="crear-description">
                Comparte tus entrenamientos, experiencias y opiniones
                con la comunidad de Side Of MMA.
            </p>

            <!-- Formulario de publicación -->
            <form id="form-publicacion" class="crear-form">

                <fieldset>
                    <legend>Nueva publicación</legend>

                    <!-- Nombre de usuario -->
                    <div class="form-group">
                        <label for="usuario">
                            Nombre de usuario
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Ingresa tu usuario"
                            maxlength="30"
                            required
                        >
                    </div>

                    <!-- Contenido -->
                    <div class="form-group">
                        <label for="contenido">
                            Contenido
                        </label>

                        <textarea
                            id="contenido"
                            name="contenido"
                            rows="6"
                            maxlength="2000"
                            placeholder="¿Qué quieres compartir sobre MMA?"
                            required
                        ></textarea>
                    </div>

                    <!-- Categoría -->
                    <div class="form-group">
                        <label for="categoria">
                            Categoría
                        </label>

                        <select
                            id="categoria"
                            name="categoria"
                            required
                        >
                            <option value="">
                                Selecciona una categoría
                            </option>

                            <option value="personal">
                                Personal
                            </option>

                            <option value="entrenamiento">
                                Entrenamiento
                            </option>

                            <option value="noticias">
                                Noticias
                            </option>

                            <option value="eventos">
                                Eventos
                            </option>
                        </select>
                    </div>

                    <!-- Imagen opcional -->
                    <div class="form-group">
                        <label for="imagen">
                            Imagen (opcional)
                        </label>

                        <input
                            type="file"
                            id="imagen"
                            name="imagen"
                            accept="image/*"
                        >
                    </div>

                    <!-- Botones del formulario -->
                    <div class="form-buttons">

                        <button
                            type="submit"
                            class="btn-publicar"
                        >
                            Publicar
                        </button>

                        <button
                            type="reset"
                            class="btn-limpiar"
                        >
                            Limpiar
                        </button>
                    </div>
                </fieldset>
            </form>
        </section>

    </main>

<!-- JavaScript -->
<script src="../js/script.js"></script>
